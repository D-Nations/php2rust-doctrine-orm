[package]
name = "php2rust-doctrine-orm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Port of doctrine/orm"

[dependencies]
php2rust-doctrine-lexer = { path = "../php2rust-doctrine-lexer" }
php-value = { workspace = true }
php2rust-doctrine-collections = { path = "../php2rust-doctrine-collections" }
php2rust-doctrine-dbal = { workspace = true }
php2rust-doctrine-event-manager = { path = "../php2rust-doctrine-event-manager" }
php2rust-doctrine-inflector = { path = "../php2rust-doctrine-inflector" }
php2rust-doctrine-persistence = { path = "../php2rust-doctrine-persistence" }
md-5 = "0.11"
sha1 = "0.10"

[dev-dependencies]
php-value = { workspace = true, features = ["vectors"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
